name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Type check
        run: mypy app --ignore-missing-imports
      - name: Tests
        run: pytest -q

  postgres:
    # Migrations, the pgvector column and the vector distance query on the same image as docker-compose.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: siteguard
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: siteguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siteguard" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.lock -e ".[dev]"
      - name: PostgreSQL integration tests
        env:
          SITEGUARD_TEST_POSTGRES_URL: postgresql+psycopg://siteguard:ci-only@localhost:5432/siteguard_test
        run: pytest -q tests/test_postgres.py -rs

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t siteguard-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SITEGUARD_DATABASE_URL=sqlite:////tmp/siteguard.db \
            -e SITEGUARD_JWT_SECRET=ci-only-secret-0123456789abcdef siteguard-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          pip install httpx
          python scripts/demo_walkthrough.py --base-url http://localhost:8000 --out /tmp/RESULTS.md
          docker logs api | tail -5
