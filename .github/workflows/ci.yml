name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Type check
        run: mypy app --ignore-missing-imports
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t siteguard-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SITEGUARD_DATABASE_URL=sqlite:////tmp/siteguard.db \
            -e SITEGUARD_JWT_SECRET=ci-only-secret-0123456789abcdef siteguard-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          pip install httpx
          python scripts/demo_walkthrough.py --base-url http://localhost:8000 --out /tmp/RESULTS.md
          docker logs api | tail -5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install API
        run: pip install -r backend/requirements.lock -e backend
      - name: Start API (SQLite, demo data, offline rules provider)
        working-directory: backend
        env:
          SITEGUARD_DATABASE_URL: sqlite:////tmp/e2e.db
          SITEGUARD_EVIDENCE_DIR: /tmp/e2e-evidence
        run: |
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
      - name: Install web app
        working-directory: frontend
        run: npm ci
      - name: Build and start web app
        working-directory: frontend
        env:
          SITEGUARD_API_URL: http://localhost:8000
          HOSTNAME: 127.0.0.1
        run: |
          npm run build
          nohup npm start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 2; done
          curl -sf localhost:3000/api/health
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: frontend
        env:
          E2E_WEB_URL: http://localhost:3000
        run: npm run e2e
      - name: Server logs
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
