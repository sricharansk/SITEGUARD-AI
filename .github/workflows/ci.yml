name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests migrations && ruff format --check app tests migrations
      - name: Type check
        run: mypy app --ignore-missing-imports
      - name: Tests (unit, API, migrations, evaluation and red-team gates)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build static app
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (web app + API)
        run: docker build -f backend/Dockerfile -t siteguard-api:ci .
      - name: Start container (migrations run on start)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SITEGUARD_DATABASE_URL=sqlite:////tmp/siteguard.db \
            -e SITEGUARD_JWT_SECRET=ci-only-secret-0123456789abcdef siteguard-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/app/ > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser end-to-end tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8000 npx playwright test
      - name: Resolve every open incident over HTTP
        run: |
          pip install httpx
          python scripts/resolve_all.py --base-url http://localhost:8000 --out /tmp/RESULTS.md --reports-dir /tmp/reports
          docker logs api 2>&1 | tail -5
