name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so newly published advisories fail the dependency audit even when nothing is pushed.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check app tests migrations ../scripts && ruff format --check app tests migrations ../scripts
      - name: Type check
        run: mypy app --ignore-missing-imports
      - name: Tests (unit, API, migrations, evaluation and red-team gates)
        run: pytest -q

  postgres:
    # Migrations and pgvector search on the same image as docker-compose, and the backup and restore drill
    # (scripts/backup.py into a fresh database; docs/DEPLOYMENT.md#backup-and-restore).
    # Pinned to 24.04: its archive has postgresql-client-16, which ubuntu-latest (26.04) no longer ships.
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: siteguard
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: siteguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siteguard" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.lock -e ".[dev]"
      - name: PostgreSQL 16 client tools
        # pg_dump must not be older than the server.
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16
          fi
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Migrations on PostgreSQL match the models
        env:
          SITEGUARD_DATABASE_URL: postgresql+psycopg://siteguard:ci-only@localhost:5432/siteguard_test
        run: alembic upgrade head && alembic check
      - name: pgvector integration (vector column, hybrid search)
        env:
          SITEGUARD_TEST_POSTGRES_URL: postgresql+psycopg://siteguard:ci-only@localhost:5432/siteguard_test
        run: pytest -q tests/test_postgres.py -rs
      - name: Backup and restore drill
        env:
          SITEGUARD_TEST_POSTGRES_URL: postgresql+psycopg://siteguard:ci-only@localhost:5432/siteguard_test
          SITEGUARD_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: pytest -q tests/test_backup_restore.py -rs

  neo4j:
    # Knowledge graph adapter against a real Neo4j, on the same image as the docker-compose `graph` profile.
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password 'RETURN 1'" --health-interval 10s
          --health-timeout 10s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.lock -e ".[dev]"
      - name: Neo4j integration tests
        env:
          SITEGUARD_TEST_NEO4J_URI: bolt://localhost:7687
          SITEGUARD_TEST_NEO4J_USER: neo4j
          SITEGUARD_TEST_NEO4J_PASSWORD: ci-only-password
        run: pytest -q tests/test_graph.py -rs

  dependency-audit:
    # Known vulnerabilities in the locked Python packages and the web app's production dependencies fail the build
    # unless .github/dependency-audit-exceptions.toml holds a reviewed, unexpired exception (docs/SECURITY.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Python dependencies (backend/requirements.lock)
        run: python scripts/dependency_audit.py pypi --requirements backend/requirements.lock
      - name: Web app production dependencies (npm audit --omit=dev --audit-level=high)
        run: python scripts/dependency_audit.py npm --project frontend

  infrastructure:
    # Offline checks only: workflow syntax and the Azure Bicep templates. Nothing is deployed from CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: actionlint
        run: |
          pip install actionlint-py==1.7.12.25
          actionlint -color
      - name: Bicep build and lint
        run: |
          az bicep install
          az bicep build --file deployment/azure/main.bicep --stdout > /dev/null
          for f in deployment/azure/main.bicep deployment/azure/modules/*.bicep; do az bicep lint --file "$f"; done
          SITEGUARD_POSTGRES_ADMIN_PASSWORD=offline-validation-only \
            az bicep build-params --file deployment/azure/main.example.bicepparam --stdout > /dev/null
      - name: Staging compose file
        working-directory: deployment/staging
        env:
          POSTGRES_PASSWORD: offline-validation-only
          SITEGUARD_JWT_SECRET: offline-validation-only
          SITEGUARD_PUBLIC_WEB_URL: https://staging.example.com/app
        run: docker compose -f docker-compose.staging.yml config -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build static app
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (web app + API)
        run: docker build -f backend/Dockerfile -t siteguard-api:ci .
      - name: Start container (migrations run on start)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SITEGUARD_DATABASE_URL=sqlite:////tmp/siteguard.db \
            -e SITEGUARD_JWT_SECRET=ci-only-secret-0123456789abcdef siteguard-api:ci
          for _ in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/app/ > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser end-to-end tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8000 npx playwright test
      - name: Smoke test (health, refused anonymous reads, demo sign-in, web app and CSP)
        env:
          SITEGUARD_SMOKE_EMAIL: auditor@demo.siteguard.local
          SITEGUARD_SMOKE_PASSWORD: siteguard-demo
        run: |
          pip install httpx==0.28.1
          python scripts/smoke_test.py --api-url http://localhost:8000 --web-url http://localhost:8000 --require-login
      - name: Resolve every open incident over HTTP
        run: |
          python scripts/resolve_all.py --base-url http://localhost:8000 --out /tmp/RESULTS.md --reports-dir /tmp/reports
          docker logs api 2>&1 | tail -5
      - name: Load test (readers plus concurrent incident reports; docs/LOAD_TEST.md)
        run: |
          python scripts/load_test.py --base-url http://localhost:8000 --users 10 --writers 4 --duration 20 \
            --max-error-rate 0 --max-p95-ms 5000
