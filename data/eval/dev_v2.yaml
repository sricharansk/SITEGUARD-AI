# Additional development set: labelled SYNTHETIC incident reports (not real events), for tuning the rules.
# Written 2026-10-12 by an author who did not see the held-out set heldout_v2.yaml.
cases:
- id: W01
  split: dev
  title: "Roofer went through rooflight on warehouse roof"
  description: "Roofer stepped back while fixing sheets and went straight through an unprotected rooflight, landing on the racking about 6 m below. Airlifted with pelvic and leg injuries. The safety netting under the rooflights had been dropped the day before so the sparks could get their containment in."
  people_involved: 1
  class: Fall from height
  domain: SAFETY
  severity: CRITICAL
  expected_doc: Working at Height
- id: W02
  split: dev
  title: "Painter toppled off the steps"
  description: "Statement: I was on the second tread of the hop-up doing the soffit with the roller and it rocked on bits of loose screed, I toppled off the steps and put my hand out. Wrist swollen, first aider gave me an ice pack and I went on light duties for the afternoon."
  people_involved: 1
  class: Fall from height
  domain: SAFETY
  severity: MEDIUM
  expected_doc: Working at Height
