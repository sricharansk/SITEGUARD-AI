# Site Guard AI evaluation set: labelled SYNTHETIC incident reports (not real events).
#
# split: dev  = may be used when tuning the rules taxonomy. Every case in this file is dev.
#   origin: test-v1 marks the cases that were the held-out test split until 12 October 2026. Their results had been
#   seen during development, so they were moved to dev; the held-out test split is now data/eval/heldout_v2.yaml,
#   written by an independent author before the next round of tuning.
#
# Labelling guide (worst credible outcome, the same idea as the 5x5 matrix consequence):
#   CRITICAL  fatality or permanent disability, or a realistic potential for it to several people
#   HIGH      hospital / lost-time injury, high-energy near miss, or a defect in a structural element
#   MEDIUM    first-aid or minor injury, or a non-structural defect needing rework
#   LOW       no injury and no realistic potential for one; cosmetic issue
# class: the primary hazard/defect class from the Site Guard taxonomy (backend/app/agents/rules.py)
# also_ok: other classes a competent reviewer would accept as primary
# expected_doc: substring of the knowledge document a reviewer would expect to be retrieved
cases:
# ---------------------------------------------------------------- dev split
- id: D01
  split: dev
  title: Roofer slipped on fragile roof sheet
  description: A roofer stepped onto a fragile rooflight while fixing sheets and fell through it, landing on the mezzanine 3 m below. He was taken to hospital with a broken leg. There were no covers over the rooflights.
  people_involved: 1
  class: Fall from height
  domain: SAFETY
  severity: HIGH
  expected_doc: Working at Height
- id: D02
  split: dev
  title: Ladder kicked out while painter was on it
  description: A painter was on an unsecured ladder at about 2.5 m when it slid on the wet floor. He grabbed a pipe and climbed down. Near miss, no injury.
  people_involved: 1
  class: Fall from height
  domain: SAFETY
  severity: HIGH
  expected_doc: Working at Height
- id: D03
  split: dev
  title: Bolt dropped from steel erection fell onto hard hat
  description: A bolt was dropped by a steel erector two floors above and hit a labourer on his hard hat. He had a headache and was checked by the first aider. There was no exclusion zone below the erection work.
  people_involved: 1
  class: Struck by falling or moving object
  also_ok: [Missing or incorrect PPE]
  domain: SAFETY
  severity: HIGH
  expected_doc: Working at Height
- id: D04
  split: dev
  title: Trench side caved in near pipe layer
  description: The side of a 2 m deep trench caved in while a pipe layer was working at the far end. He was not buried. The trench had no trench box and the spoil heap was at the edge.
  people_involved: 1
  class: Excavation collapse / caught-in
  domain: SAFETY
  severity: CRITICAL
  expected_doc: Excavation
- id: D05
  split: dev
  title: Excavator bucket struck buried power cable
  description: While digging for a foundation the excavator struck an underground 11 kV cable, causing a flash and a power cut to the site. Services drawings had not been checked and no cable avoidance tool was used.
  people_involved: 1
  class: Electrical contact
  also_ok: [Mobile plant / vehicle, Excavation collapse / caught-in]
  domain: SAFETY
  severity: CRITICAL
  expected_doc: Excavation
- id: D06
