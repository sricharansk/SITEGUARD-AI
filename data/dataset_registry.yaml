# Site Guard AI dataset registry (docs/DATASETS.md). Every dataset must be registered here, with licence and
# allowed use, before it enters a pipeline. Raw and processed files live under data/raw and data/processed, which
# are git-ignored: download them yourself under the source's terms.
#
# status values: pipeline-ready (code exists and is tested), planned, reference-only.
# acquired: whether this repository's published results used the dataset. On 12 October 2026 the build sandbox's
# network policy blocked osha.gov, bls.gov, hse.gov.uk and huggingface.co, so no public dataset was downloaded;
# all published results use synthetic data.

- id: osha_severe_injury_reports
  name: OSHA Severe Injury Reports
  publisher: US Department of Labor, OSHA
  source_url: https://www.osha.gov/severeinjury
  observation_period: "2015 onwards; use 2024-2026 records"
  modality: tabular (narratives + OIICS codes)
  license: US federal government data; see source terms
  commercial_use: review-required
  purpose: [evaluation, taxonomy, analytics]
  raw_location: data/raw/government/osha/
  processed_location: data/processed/government/osha_sir/
  extraction_method: "python -m app.datasets.osha_sir: checksum -> column validation -> NAICS 23 filter -> dedupe -> triage evaluation"
  limitations: Federal-jurisdiction employers that reported; not a census. Never rank or judge employers.
  status: pipeline-ready
  acquired: false

- id: osha_ita_2025
  name: OSHA Injury Tracking Application 2025
  publisher: OSHA
  source_url: https://www.osha.gov/itadata
  release_date: "2026"
  observation_period: "2025"
  access_date: "09 October 2026"
  version: current-2025-release
  modality: tabular
  license: see source terms
  commercial_use: review-required
  purpose: [analytics, evaluation, taxonomy]
  raw_location: data/raw/government/osha/
  processed_location: data/processed/government/osha/
  extraction_method: official CSV/XLSX -> schema validation -> normalization
  limitations: Not fully representative of all employers; submitted data can contain unresolved errors.
  status: planned
  acquired: false

