[project]
name = "siteguard-ai-backend"
version = "0.1.0"
description = "Site Guard AI: Multi-Agent Construction Safety & Quality Incident Resolution System - API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "anthropic>=1.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "pgvector>=0.3",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
# Dev tools are pinned so local runs match CI exactly.
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10", "mypy==2.4.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Query() defaults

[tool.mypy]
exclude = ["app/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["script.py.mako"]
