# Local pilot stack: PostgreSQL (pgvector image, ready for vector search) + API + web app.
# Usage: cp .env.example .env && docker compose up --build   (web app: http://localhost:3000)
# The staging stack is deployment/staging/docker-compose.staging.yml (docs/DEPLOYMENT.md).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: siteguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siteguard-local}
      POSTGRES_DB: siteguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteguard"]
      interval: 5s
      retries: 10

  api:
    image: siteguard-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    # .env sets SITEGUARD_ENV (local or demo); the image itself defaults to production and refuses unsafe settings.
    env_file: [.env]
    environment:
      SITEGUARD_DATABASE_URL: postgresql+psycopg://siteguard:${POSTGRES_PASSWORD:-siteguard-local}@db:5432/siteguard
    ports: ["8000:8000"]
    volumes: [evidence:/srv/evidence]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: siteguard-web:local
    build:
      context: ./frontend
    environment:
      # Server-side only: the browser talks to the web app, which calls the API with the session token.
      SITEGUARD_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

  # Optional knowledge graph (docs/ARCHITECTURE.md#knowledge-graph). Not started by default:
  #   docker compose --profile graph up -d neo4j
  # then set SITEGUARD_GRAPH_BACKEND=neo4j, SITEGUARD_NEO4J_URI=bolt://neo4j:7687 and SITEGUARD_NEO4J_PASSWORD (the
  # same value as NEO4J_PASSWORD) in .env, restart the api and run `python -m app.jobs graph-sync` in it.
  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-siteguard-graph-local}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12

volumes:
  pgdata:
  evidence:
  neo4jdata:
